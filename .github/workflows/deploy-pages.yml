name: Deploy wedding invitation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site files
        run: |
          mkdir -p _site/assets
          cp -R html/. _site/
          cp -R css js _site/
          cp assets/GreatVibes-Regular.ttf assets/GreatVibes-OFL.txt assets/abhijit.jpeg assets/shivani.png assets/divider.svg _site/assets/
          sed -i \
            -e 's|../css/|css/|g' \
            -e 's|../js/|js/|g' \
            -e 's|../assets/|assets/|g' \
            _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
